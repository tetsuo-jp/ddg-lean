related_formalizations: []

status:
  scope: >-
    Formalized: the four statements listed in the description, for triangles in
    EuclideanSpace ℝ (Fin 2).

    linear_precision is stated for a one-ring indexed by ZMod n in which every
    triangle (p, q j, q (j+1)) is positively oriented, and sums the two corner
    contributions of each incident triangle.  That is the assembly order of the
    finite element method; it equals the more familiar per-edge grouping by
    reindexing, but the reindexing is not proved here.

    Not formalized: any connection to integration.  The gradient is not
    constructed and no integral is taken.  The vector g in the statements is
    constrained only by the inner products ⟪g, eₖ⟫ appearing in them; it is the
    gradient of the affine interpolant exactly when those equal the vertex-value
    differences, but that correspondence is asserted in prose here, not proved.
    Consequently the "Dirichlet energy" reading of the identity is an
    interpretation supplied by the reader, and the Lean content is the algebraic
    identity.  Only the plane is treated; triangles in R^3 are not.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        The agent wrote the Lean source and the mutation script, iterating
        against `lake build`.  The identity was checked numerically on 20000
        random triangles before any Lean was written, together with a
        deliberately corrupted variant to confirm the numerical check could
        detect an error.
      cost:
        wall_time: "about two hours of elapsed session time"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The one substantive intervention was about proof engineering rather
        than mathematics: expanding the inner products into coordinates and
        calling `ring` costs 262 s and 5 GB and did not finish within ten
        minutes for the three-point statement, so the development was rewritten
        to keep the inner products opaque and give `ring` only the Lagrange and
        Binet–Cauchy identities.  The module then builds in 14 s.
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, machine-written.  Every proof step is checked by Lean.
    scripts/audit.sh enforces the trust conditions and fails closed, and
    scripts/mutation_test_cotan.py checks that the constants and definitions in
    the claimed statements are load-bearing: nine mutations each break the
    build and one harmless edit does not.

fidelity:
  divergences: >-
    The cited source states the formula as an identity about the Dirichlet
    integral of a piecewise linear function on a triangulated surface.  This
    development proves the algebraic identity for a single triangle, with the
    gradient entering only through the inner products ⟪g, eₖ⟫ and no integral
    taken.  See status.scope.

    One further point a reviewer should know.  The hypothesis `sarea2 p ≠ 0`
    of `cotan_form` is not needed for the Lean statement to be true: at a
    degenerate triangle every interior angle is 0, π or π/2, and `Real.cot` is
    0 at all three because Lean defines `x / 0 = 0`.  Both sides are then 0.
    The hypothesis is kept deliberately, because without it the degenerate case
    asserts a junk value rather than a fact about triangles.  The mutation test
    shows only that the proof uses the hypothesis, not that the statement needs
    it; this note records the difference.

review:
  status: self-assessed
  reviewers:
    - "Tetsuo Yokoyama"
  notes: >-
    No external or independent review has been performed.  The statements were
    read for fidelity by the author, checked numerically before formalization,
    and probed by the mutation test.  Every proof step is checked by Lean.

alignment:
  namespace: "Cotan"
  statements:
    - source: "Singularity of the Gram matrix of three plane vectors"
      lean: "Cotan.gram_two"
      module: "CotanSolution"
      status: proved
      note: "The geometric core; everything else is bookkeeping around it."
    - source: "Pinkall–Polthier 1993, cotangent formula (inner-product form)"
      lean: "Cotan.inner_form"
      module: "CotanSolution"
      status: adapted
      note: >-
        The identity with cot θₖ * 2A replaced by the inner product of the two
        edges at vertex k.  Holds with no hypotheses, including for degenerate
        triangles.
    - source: "cot θ * 2A = inner product of the spanning edges"
      lean: "Cotan.cot_angle_mul_abs_cross"
      module: "CotanSolution"
      status: proved
      note: "The conversion between the inner-product and cotangent forms."
    - source: "Pinkall–Polthier 1993, cotangent formula"
      lean: "Cotan.cotan_form"
      module: "CotanSolution"
      status: adapted
      note: >-
        The cotangent statement for a nondegenerate plane triangle, without the
        integral of the cited source.  See fidelity.divergences.

    - source: "Two corner weights of one triangle (inner-product form)"
      lean: "Cotan.corner_pair_inner"
      module: "CotanSolution"
      status: proved
      note: "Holds with no hypotheses, including for degenerate triangles."
    - source: "Two corner weights of one positively oriented triangle"
      lean: "Cotan.corner_pair"
      module: "CotanSolution"
      status: proved
      note: >-
        The cotangent-weighted edge vectors add up to a quarter turn of the
        opposite edge.
    - source: >-
        Wardetzky-Mathur-Kalberer-Grinspun 2007, property (LIN) for the
        cotangent Laplacian
      lean: "Cotan.linear_precision"
      module: "CotanSolution"
      status: adapted
      note: >-
        Proved in the plane, for a closed one-ring whose triangles are all
        positively oriented, in the per-triangle assembly order.  See
        status.scope.

