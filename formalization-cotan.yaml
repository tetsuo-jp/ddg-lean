    type: "article"
    location: "Experimental Mathematics 2 (1993) 15–36"
    relationship: independently-proves
    license: "unknown"
    author_endorsement: "not-contacted"
    note: >-
      The standard reference for the cotangent formula in discrete differential
      geometry.  The Lean proof here was written directly rather than by
