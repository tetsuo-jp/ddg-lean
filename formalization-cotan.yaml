# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The cotangent formula for the Dirichlet energy of a triangle"
  description: >-
    For a triangle in the Euclidean plane and an affine function on it, the
    Dirichlet energy 2A * ‖∇u‖^2 equals the sum over the three vertices of
    cot θₖ * (uᵢ - uⱼ)^2, where θₖ is the interior angle at vertex k and
    uᵢ - uⱼ is the jump of u across the opposite edge.  This is the identity
    behind the cotangent Laplacian of discrete differential geometry.

    Four results are claimed.  gram_two is the geometric core: the Gram matrix
    of three vectors of the plane is singular.  inner_form is the cotangent
    identity with each "cot θₖ * 2A" replaced by the inner product of the two
    edges at vertex k, and needs no hypotheses at all.
    cot_angle_mul_abs_cross is the conversion between the two.  cotan_form is
    the cotangent statement itself, for a nondegenerate triangle.
  authors:
    - "Tetsuo Yokoyama"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tetsuo Yokoyama"

classification:
